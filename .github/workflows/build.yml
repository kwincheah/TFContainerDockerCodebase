name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image to GitHub Container Registry"
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/runpod-cv-env

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CUDA/PyTorch base image is large; free ~25 GB of preinstalled tooling first
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cvenv:ci

      - name: Smoke test (CNN + YOLO11n on CPU)
        run: docker run --rm -v "$PWD/examples:/examples:ro" cvenv:ci python /examples/smoke_test.py

      - name: Image metadata
        id: meta
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Log in to GHCR
        if: steps.meta.outcome == 'success'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: steps.meta.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
